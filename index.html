</style></head><body>

function addWall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,WH,d),M(0x556677));m.position.set(x,WH/2,z);scene.add(m);const b={x,z,w,d};boxes.push(b);walls.push({m,b,o:Math.abs(x)>=R||Math.abs(z)>=R})}

for(let k=0;k<14;k++){const c=(rnd()*N*N)|0,l=nb(c),n=l[(rnd()*l.length)|0];open[c].add(n);open[n].add(c)}

for(let c=0;c<N*N;c++){const i=c%N,j=(c/N)|0;
if(i<N-1&&!open[c].has(c+1))addWall(-R+(i+1)*CS,-R+(j+.5)*CS,.8,CS+.8);
if(j<N-1&&!open[c].has(c+N))addWall(-R+(i+.5)*CS,-R+(j+1)*CS,CS+.8,.8)}
addWall(0,-R,R*2+.8,.8);addWall(0,R,R*2+.8,.8);addWall(-R,0,.8,R*2+.8);addWall(R,0,.8,R*2+.8)}
buildMaze(Math.random);
[].map(([x,z,w,d])=>{

const me=human(0x3a8dff,false);scene.add(me);
me.userData.arm.children[0].material.color.set(0xffee00);me.userData.arm.children[0].material.emissive.set(0x886600);
me.userData.arm.children[1].material.color.set(0xff6600);me.userData.arm.children[1].material.emissive.set(0xaa3300);

const laser=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,30,6),new THREE.MeshBasicMaterial({color:0xff2222}));
laser.rotation.x=Math.PI/2;laser.position.set(.4,1.5,-1.15-15);me.add(laser);
const camObj=new THREE.Mesh(new THREE.BoxGeometry(.5,.35,.4),M(0xffcc00));scene.add(camObj);
const lens=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.2,10),M(0x111111));lens.rotation.x=Math.PI/2;lens.position.z=-.28;camObj.add(lens);
let P,holding,camPos,camYaw,enemies,bullets,wave,score,over,started,lastShot,tipT;
const keys={};let beamT=0,beamCd=0,dirt=0,tLeft=180,mode='cpu',mazeOn=true,eb=[],auto=false,placedT=0,knifeCd=0,knifeT=0,net=null,peersL=[],myId=null,hostId=null,remotes=new Map(),orbs=[],orbId=0,orbT=30,dealt=0,pvpOn=false,armV=0,flashCd=0,whiteT=0,hadRem=false,sendT=0,fxT={atk:0,spd:0,clean:0,arm:0,narrow:0,imm:0,slow:0,scan:0};
function reset(){
  P={x:-R+CS/2,z:R-CS/2,yaw:0,pitch:0,hp:5};holding=true;camPos=new THREE.Vector3();camYaw=0;
  (enemies||[]).forEach(e=>scene.remove(e.g));(bullets||[]).forEach(b=>scene.remove(b.m));
  enemies=[];bullets=[];wave=0;score=0;over=false;lastShot=0;tipT=0;beamT=beamCd=0;auto=false;dirt=0;tLeft=180;nextWave()}
function nextPt(fx,fz,tx,tz){const tc=cellOf(tx,tz),fc=cellOf(fx,fz);if(!mazeOn||tc===fc)return[tx,tz];
  const d=new Array(N*N).fill(999);d[tc]=0;const q=[tc];for(let h=0;h<q.length;h++){const c=q[h];for(const n of open[c])if(d[n]>d[c]+1){d[n]=d[c]+1;q.push(n)}}
  let b=fc;for(const n of open[fc])if(d[n]<d[b])b=n;return cc(b%N,(b/N)|0)}
function setMaze(on){mazeOn=on;boxes.length=0;walls.forEach(w=>{const a=on||w.o;w.m.visible=a;if(a)boxes.push(w.b)})}
function spawnBoss(){const t=Math.random()<.5?'gun':'rush',g=human(t==='gun'?0x8e44ad:0xe67e22,t!=='gun');g.scale.setScalar(1.6);const x=0,z=P.z>0?-15:15;g.position.set(x,0,z);scene.add(g);enemies.push({g,x,z,hp:t==='gun'?12:10,cd:2,sw:0,t:0,boss:t});$('tip').textContent='ボス出現!('+(t==='gun'?'銃使い':'足が速い格闘型')+')';tipT=3}
function nextWave(){if(mode==='pvp')return;wave++;const boss=wave%2===0;setMaze(!boss);eb.forEach(b=>scene.remove(b.m));eb=[];if(wave>1&&!boss){P.x=-R+CS/2;P.z=R-CS/2;holding=true}if(boss){spawnBoss();return}const n=3+wave;

    const g=human(0xc0392b,true);g.position.set(x,0,z);scene.add(g);enemies.push({g,x,z,hp:1,cd:1+Math.random(),sw:0,t:Math.random()*6})}}
function hitBox(x,z,r){return boxes.some(b=>Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)}
function push(o,r){o.x=Math.max(-R+r,Math.min(R-r,o.x));o.z=Math.max(-R+r,Math.min(R-r,o.z));

function toggleCam(){
  if(over)return;

    const o={x:P.x-fx*2,z:P.z-fz*2};push(o,.5);camPos.set(o.x,.35,o.z);camYaw=P.yaw;holding=false;placedT=0;
    P.pitch=0}
  else if(Math.hypot(P.x-camPos.x,P.z-camPos.z)<3){holding=true;P.yaw=camYaw;P.pitch=0;try{ren.domElement.requestPointerLock()}catch(e){}}
  else{$('tip').textContent='カメラに近づいてからCで拾えます';tipT=2}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyC'&&started)toggleCam();if(e.code==='KeyF'&&started)flash();if(spectating()){if(e.code==='ArrowRight')specI++;if(e.code==='ArrowLeft')specI--}});

let mX=innerWidth/2,mY=innerHeight/2;
addEventListener('mousemove',e=>{mX=e.clientX;mY=e.clientY;if(started&&!over&&document.pointerLockElement){P.yaw-=e.movementX*.0025;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*.0025))}});

const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
